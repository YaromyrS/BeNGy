<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
	<!-- Git branch mark: trunk with two nodes, one branch curving to a third. -->
	<g stroke="#FFFFFF" fill="none" stroke-linecap="round">
		<!-- trunk -->
		<line x1="180" y1="160" x2="180" y2="296" stroke-width="30" />
		<!-- branch curve from trunk to the right node -->
		<path d="M 180 248 C 180 198 210 168 252 168" stroke-width="30" />
		<!-- nodes -->
		<circle cx="180" cy="118" r="38" stroke-width="26" />
		<circle cx="180" cy="338" r="38" stroke-width="26" />
		<circle cx="296" cy="168" r="38" stroke-width="26" />
	</g>
</svg>
